# Déploie le site sur Vercel (projet « lockintrip », équipe « walltrade football »).
#
# Prérequis : un secret de dépôt VERCEL_TOKEN
#   1. vercel.com → Account Settings → Tokens → Create (portée : équipe walltrade football)
#   2. GitHub → saastechstudio/lockintrip → Settings → Secrets and variables → Actions
#      → New repository secret → nom : VERCEL_TOKEN
#
# Push sur main → production. Push sur une autre branche ou lancement manuel → preview.
name: Déploiement Vercel

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      production:
        description: "Déployer en production"
        type: boolean
        default: true

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_eLx2vOubXG8apVvHcuVD8TTd
  VERCEL_PROJECT_ID: prj_XAhmjhp8jf6Zsl1arkMR9qtzh1VD

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le jeton Vercel
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Secret VERCEL_TOKEN absent : déploiement ignoré. Voir l'en-tête de ce workflow."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Installer la CLI Vercel
        if: steps.token.outputs.ok == 'true'
        run: npm install --global vercel@latest

      - name: Choisir l'environnement
        if: steps.token.outputs.ok == 'true'
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.production }}" = "true" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"; echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"; echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer la configuration Vercel
        if: steps.token.outputs.ok == 'true'
        run: vercel pull --yes --environment=${{ steps.env.outputs.target }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.token.outputs.ok == 'true'
        run: vercel build ${{ steps.env.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Déployer
        if: steps.token.outputs.ok == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.env.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Déployé (${{ steps.env.outputs.target }}) : $url" >> "$GITHUB_STEP_SUMMARY"
