name: fetch-images
on:
  push:
    branches: [images-fetch]
  workflow_dispatch:
concurrency:
  group: fetch
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/unsplash.mjs
      - run: node scripts/fetch.mjs
        if: false
        env:
          SOURCES: wikimedia
          SKIP_SEARCH: "1"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - run: |
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "images" || echo nothing
          git push
